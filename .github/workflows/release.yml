name: Release

# Runs build/release.ps1 (test -> publish -> vpk pack) on a hosted Windows runner and attaches the
# resulting Velopack installer + delta packages to a GitHub Release. Triggered by pushing a tag
# like "v1.2.0". Installed copies of APS Planner discover this release automatically via
# VelopackUpdateBackend's GithubSource and self-update - this workflow is what "future builds
# update from within the software" actually depends on. Unlike the verification workflow, this one
# is not covered by the repo's "no CI for verification" policy: it produces a release artifact that
# cannot be built any other way in this environment (win-x64 publish + vpk pack require Windows).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  release:
    name: Build, pack, and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          [xml]$project = Get-Content "src/APS.DesktopHost/APS.DesktopHost.csproj"
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($projectVersion -ne $version) {
            throw "Tag version $version does not match APS.DesktopHost version $projectVersion."
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download previous Velopack release
        shell: pwsh
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --outputDir build/Releases --token "${{ secrets.GITHUB_TOKEN }}"
        continue-on-error: true # fails harmlessly on the very first release, when no prior version exists

      - name: Run release script
        shell: pwsh
        run: ./build/release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish Velopack release
        shell: pwsh
        run: >-
          vpk upload github
          --repoUrl "https://github.com/${{ github.repository }}"
          --outputDir build/Releases
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish
          --releaseName "APS Planner ${{ github.ref_name }}"
          --tag "${{ github.ref_name }}"
