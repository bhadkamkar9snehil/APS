name: .NET planning core

on:
  push:
    branches:
      - agent/aps-dotnet-planning-core
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore APS.slnx

      - name: Build
        run: dotnet build APS.slnx -c Release --no-restore

      - name: Test
        run: dotnet test APS.slnx -c Release --no-build --verbosity normal
