<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS Planner</title>
    <base href="/" />
    <script src="_content/APS.UI/theme.js"></script>
    <script src="_content/APS.UI/planning-workbench.js"></script>
    <script>window.apsTheme.bootstrap();</script>
    <link rel="stylesheet" href="_content/APS.UI/tailwind.css" />
    <!--
      This file lives outside APS.UI's project tree, so Tailwind's content scan never sees it and
      any Tailwind utility class referenced here silently compiles to nothing. The loading screen
      and the error banner below must render correctly even if the rest of the CSS pipeline is
      broken, so they're styled with plain inline CSS instead of Tailwind classes.
    -->
    <style>
        #blazor-error-ui {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            padding: 0.75rem 1rem;
            font-family: -apple-system, "Segoe UI", sans-serif;
            font-size: 0.875rem;
            color: #9f1239;
            background: #fff1f2;
            border-top: 1px solid #fecdd3;
        }
        #blazor-error-ui .dismiss {
            float: right;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body style="margin:0; font-family:-apple-system,'Segoe UI',sans-serif;">
    <div id="app">
        <div style="display:flex; height:100vh; width:100vw; flex-direction:column; align-items:center; justify-content:center; gap:0.5rem; background:var(--aps-canvas,#f5f3ee); color:var(--aps-text-primary,#27231f);">
            <strong style="font-size:1.5rem; font-weight:700;">APS</strong>
            <span style="font-size:0.875rem; color:var(--aps-text-muted,#746f68);">Starting&hellip;</span>
        </div>
    </div>
    <div id="blazor-error-ui">
        An unexpected error occurred.
        <a class="dismiss" onclick="document.getElementById('blazor-error-ui').style.display='none'">🗙</a>
    </div>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
